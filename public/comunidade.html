<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comunidade — Jovem Aprendiz Digital</title>
<meta name="description" content="Mural da turma do Jovem Aprendiz Digital: tire dúvidas, compartilhe dicas e converse com outros alunos.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%23E8A33D'/%3E%3Cg fill='none' stroke='%231B3A4B' stroke-width='2.3' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M21.42 10.92a1 1 0 0 0-.02-1.84L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.83l8.57 3.91a2 2 0 0 0 1.66 0z'/%3E%3Cpath d='M22 10v6'/%3E%3Cpath d='M6 12.5V16a6 3 0 0 0 12 0v-3.5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

<header class="topbar">
  <div class="logo-badge icone" data-icone="message-circle" data-icone-tamanho="20" aria-hidden="true"></div>
  <div>
    <h1 class="topbar-titulo">Comunidade</h1>
    <small>Pergunte, compartilhe, ajude alguém</small>
  </div>
</header>

<nav class="tabbar tabbar-inline" id="tabbar" aria-label="Navegação principal"></nav>

<div class="container container-comunidade">
  <main id="conteudo">

    <div class="card">
      <form id="form-post" novalidate>
        <label for="novo-post">O que você quer compartilhar com a turma?</label>
        <p class="ajuda-form" id="novo-post-ajuda">Dúvida, dica ou o que aprendeu essa semana. Aqui ninguém julga pergunta básica.</p>
        <textarea id="novo-post" required aria-describedby="novo-post-ajuda" placeholder="Ex: consegui terminar o módulo de e-mail hoje! alguma dica de como organizar minhas pastas?"></textarea>
        <div id="erro-post" class="erro-msg" role="alert"></div>
        <div class="acoes-form">
          <button type="submit" class="btn-primary">
            <span class="icone" data-icone="send" data-icone-tamanho="18" aria-hidden="true"></span> Publicar
          </button>
        </div>
      </form>
    </div>

    <div id="lista-posts" aria-live="polite">
      <p class="vazio">Carregando mural...</p>
    </div>

  </main>
</div>

<script src="/js/icones.js" defer></script>
<script src="/js/api.js" defer></script>
<script src="/js/comunidade.js" defer></script>
</body>
</html>

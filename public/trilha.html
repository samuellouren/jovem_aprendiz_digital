<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trilha — Jovem Aprendiz Digital</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

<header class="topbar">
  <a href="/dashboard.html" class="voltar" id="btn-topo-voltar" aria-label="Voltar para o início">
    <span class="icone" data-icone="arrow-left" data-icone-tamanho="22" aria-hidden="true"></span>
  </a>
  <div>
    <strong id="titulo-topo">Trilha</strong>
    <small id="subtitulo-topo"></small>
  </div>
</header>

<div class="container">
  <main id="conteudo">
    <!-- Tela 1: a trilha e seus módulos -->
    <div id="tela-trilha">
      <div id="cabecalho-trilha"></div>
      <h2 class="secao-titulo-lista">
        <span class="icone" data-icone="layers" data-icone-tamanho="19" aria-hidden="true"></span>
        Módulos da trilha
      </h2>
      <div id="lista-modulos" aria-live="polite">
        <p class="vazio">Carregando módulos...</p>
      </div>
    </div>

    <!-- Tela 2: um módulo aberto, uma seção por vez -->
    <div id="tela-modulo" hidden>
      <div class="modulo-topo" id="modulo-topo"></div>
      <div class="stepper" id="stepper" aria-label="Seções do módulo"></div>
      <div id="conteudo-passo" aria-live="polite"></div>
      <div class="secao-nav" id="secao-nav"></div>
    </div>
  </main>
</div>

<script src="/js/icones.js" defer></script>
<script src="/js/formato.js" defer></script>
<script src="/js/api.js" defer></script>
<script src="/js/trilha.js" defer></script>
</body>
</html>
